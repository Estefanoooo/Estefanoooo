<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Estefano Ramirez - Software Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1c"/>
      <stop offset="0.5" stop-color="#111634"/>
      <stop offset="1" stop-color="#1a1140"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e0e7ff"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="72"/>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>

    <g filter="url(#blur)">
      <ellipse cx="200" cy="40" rx="330" ry="180" fill="#4f46e5" opacity="0.6"/>
      <ellipse cx="1010" cy="50" rx="340" ry="190" fill="#9333ea" opacity="0.5"/>
      <ellipse cx="260" cy="340" rx="380" ry="150" fill="#0ea5e9" opacity="0.28"/>
      <ellipse cx="960" cy="340" rx="380" ry="150" fill="#6366f1" opacity="0.4"/>
    </g>

    <rect width="1200" height="320" fill="url(#grid)"/>

    <path d="M0 268 C 200 246 400 292 600 268 C 800 244 1000 294 1200 268 L1200 320 L0 320 Z" fill="#ffffff" fill-opacity="0.04"/>

    <text x="600" y="140" text-anchor="middle" font-size="64" font-weight="800" letter-spacing="-1.2" fill="url(#name)">Estefano Ramirez</text>
    <text x="600" y="186" text-anchor="middle" font-size="22" font-weight="600" letter-spacing="7" fill="#b6c2ff">SOFTWARE DEVELOPER</text>

    <line x1="524" y1="218" x2="676" y2="218" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="600" cy="218" r="4.5" fill="#c4b5fd"/>
    <circle cx="524" cy="218" r="2.5" fill="#818cf8"/>
    <circle cx="676" cy="218" r="2.5" fill="#818cf8"/>
  </g>

  <rect x="1" y="1" width="1198" height="318" rx="19" fill="none" stroke="#2a3357" stroke-width="2"/>
</svg>
