<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Estefano Ramirez - Software Developer">
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080a12"/>
      <stop offset="1" stop-color="#0d0f1c"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141b38"/>
      <stop offset="0.55" stop-color="#151733"/>
      <stop offset="1" stop-color="#1b1236"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#dbe3ff"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="accent" x1="64" y1="0" x2="188" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="10%" r="80%">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <clipPath id="round"><rect width="1200" height="380" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="380" fill="url(#canvas)"/>
    <ellipse cx="240" cy="20" rx="420" ry="220" fill="#4f46e5" opacity="0.14" filter="url(#soft)"/>
    <ellipse cx="1080" cy="360" rx="380" ry="200" fill="#9333ea" opacity="0.12" filter="url(#soft)"/>

    <!-- Hero tile -->
    <rect x="24" y="24" width="600" height="332" rx="18" fill="url(#hero)" stroke="#2b3358"/>
    <rect x="24" y="24" width="600" height="332" rx="18" fill="url(#glow)"/>
    <circle cx="600" cy="330" r="96" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    <circle cx="600" cy="330" r="64" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>

    <rect x="520" y="56" width="68" height="68" rx="18" fill="#1a2144" stroke="#3b4470"/>
    <text x="554" y="99" text-anchor="middle" font-size="24" font-weight="800" letter-spacing="0.5" fill="#a5b4fc">ER</text>

    <text x="64" y="86" font-size="13" font-weight="700" letter-spacing="4.5" fill="#818cf8">SOFTWARE DEVELOPER</text>
    <text x="60" y="178" font-size="74" font-weight="800" letter-spacing="-1.5" fill="url(#name)">Estefano</text>
    <text x="60" y="254" font-size="74" font-weight="800" letter-spacing="-1.5" fill="url(#name)">Ramirez</text>

    <line x1="64" y1="290" x2="188" y2="290" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <text x="206" y="296" font-size="17" font-weight="500" fill="#94a3b8">Backend &amp; Full-Stack</text>

    <!-- Tile: location -->
    <rect x="644" y="24" width="256" height="156" rx="16" fill="#12151f" stroke="#232838"/>
    <text x="668" y="64" font-size="12" font-weight="700" letter-spacing="2" fill="#64748b">BASED IN</text>
    <path d="M885 50c-4.4 0-8 3.6-8 8 0 6 8 16 8 16s8-10 8-16c0-4.4-3.6-8-8-8z" fill="#818cf8" opacity="0.85"/>
    <circle cx="885" cy="58" r="3" fill="#12151f"/>
    <text x="668" y="116" font-size="26" font-weight="700" fill="#f1f5f9">Lima, Perú</text>
    <text x="668" y="146" font-size="14" fill="#94a3b8">GMT-5 · Remote friendly</text>

    <!-- Tile: status -->
    <rect x="920" y="24" width="256" height="156" rx="16" fill="#12151f" stroke="#232838"/>
    <text x="944" y="64" font-size="12" font-weight="700" letter-spacing="2" fill="#64748b">STATUS</text>
    <circle cx="953" cy="110" r="12" fill="#34d399" opacity="0.18"/>
    <circle cx="953" cy="110" r="6" fill="#34d399"/>
    <text x="972" y="117" font-size="22" font-weight="700" fill="#f1f5f9">Open to work</text>
    <text x="944" y="146" font-size="14" fill="#94a3b8">Internships &amp; freelance</text>

    <!-- Tile: stack -->
    <rect x="644" y="200" width="256" height="156" rx="16" fill="#12151f" stroke="#232838"/>
    <text x="668" y="240" font-size="12" font-weight="700" letter-spacing="2" fill="#64748b">STACK</text>
    <g fill="none" stroke="#818cf8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M868 230l-6 8 6 8"/>
      <path d="M884 230l6 8-6 8"/>
      <path d="M879 228l-4 20"/>
    </g>
    <text x="668" y="288" font-size="21" font-weight="600" fill="#e2e8f0">Python · FastAPI</text>
    <text x="668" y="318" font-size="21" font-weight="600" fill="#94a3b8">React · TypeScript</text>

    <!-- Tile: focus -->
    <rect x="920" y="200" width="256" height="156" rx="16" fill="#12151f" stroke="#232838"/>
    <text x="944" y="240" font-size="12" font-weight="700" letter-spacing="2" fill="#64748b">FOCUS</text>
    <circle cx="1150" cy="240" r="9" fill="none" stroke="#818cf8" stroke-width="2.4"/>
    <circle cx="1150" cy="240" r="3" fill="#c4b5fd"/>
    <text x="944" y="288" font-size="21" font-weight="600" fill="#e2e8f0">REST APIs</text>
    <text x="944" y="318" font-size="21" font-weight="600" fill="#94a3b8">Full-Stack Apps</text>
  </g>

  <rect x="1" y="1" width="1198" height="378" rx="21" fill="none" stroke="#232a44" stroke-width="2"/>
</svg>
