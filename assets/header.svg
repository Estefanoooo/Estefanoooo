<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Estefano Ramirez - Backend and Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020">
        <animate attributeName="stop-color" values="#0b1020;#131a3a;#0b1020" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#1e1b4b">
        <animate attributeName="stop-color" values="#1e1b4b;#312e81;#1e1b4b" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#0b1020">
        <animate attributeName="stop-color" values="#0b1020;#2a1a4a;#0b1020" dur="14s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="0.4" stop-color="#e0e7ff"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#e0e7ff"/>
      <stop offset="1" stop-color="#c4b5fd"/>
      <animate attributeName="x1" values="-0.6;1.6" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.4;2.6" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="halo" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="round"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="260" fill="url(#bg)"/>

    <ellipse cx="600" cy="92" rx="540" ry="150" fill="url(#halo)">
      <animate attributeName="opacity" values="0.65;1;0.65" dur="8s" repeatCount="indefinite"/>
    </ellipse>

    <g fill="#a5b4fc">
      <circle cx="150" cy="70" r="2.4" opacity="0.7"><animate attributeName="cy" values="70;56;70" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.8;0.2" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="260" cy="180" r="2" opacity="0.6"><animate attributeName="cy" values="180;164;180" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.7;0.15" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="340" cy="60" r="1.8" opacity="0.5"><animate attributeName="cy" values="60;46;60" dur="5.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.6;0.15" dur="5.5s" repeatCount="indefinite"/></circle>
      <circle cx="470" cy="205" r="2.2" opacity="0.6"><animate attributeName="cy" values="205;190;205" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.7;0.15" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="720" cy="205" r="2.2" opacity="0.6"><animate attributeName="cy" values="205;190;205" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.7;0.15" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="860" cy="60" r="1.8" opacity="0.5"><animate attributeName="cy" values="60;46;60" dur="5.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.6;0.15" dur="5.5s" repeatCount="indefinite"/></circle>
      <circle cx="940" cy="180" r="2" opacity="0.6"><animate attributeName="cy" values="180;164;180" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.7;0.15" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="1050" cy="70" r="2.4" opacity="0.7"><animate attributeName="cy" values="70;56;70" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.8;0.2" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="600" cy="40" r="1.6" opacity="0.5"><animate attributeName="cy" values="40;28;40" dur="6.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.6;0.15" dur="6.5s" repeatCount="indefinite"/></circle>
      <circle cx="600" cy="222" r="1.6" opacity="0.5"><animate attributeName="cy" values="222;208;222" dur="6.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.6;0.15" dur="6.5s" repeatCount="indefinite"/></circle>
    </g>

    <text x="600" y="120" text-anchor="middle" font-size="78" font-weight="800" letter-spacing="0.5" fill="url(#nameGrad)" filter="url(#glow)">Estefano Ramirez</text>

    <text x="600" y="168" text-anchor="middle" font-size="23" font-weight="500" letter-spacing="3.5" fill="#c7d2fe">Backend &amp; Full-Stack Developer</text>

    <line x1="470" y1="198" x2="730" y2="198" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="x1" values="520;470;520" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="680;730;680" dur="6s" repeatCount="indefinite"/>
    </line>
  </g>

  <rect x="1" y="1" width="1198" height="258" rx="18" fill="none" stroke="#312e81" stroke-width="2"/>
</svg>
