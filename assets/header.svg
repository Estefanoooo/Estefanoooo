<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Estefano Ramirez - Software Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="0.55" stop-color="#131a33"/>
      <stop offset="1" stop-color="#1c1642"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0e7ff"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="0%" r="75%">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0%" cy="100%" r="65%">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="280" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="280" fill="url(#bg)"/>
    <rect width="1200" height="280" fill="url(#grid)"/>
    <rect width="1200" height="280" fill="url(#glowA)"/>
    <rect width="1200" height="280" fill="url(#glowB)"/>
    <circle cx="600" cy="140" r="232" fill="none" stroke="#818cf8" stroke-opacity="0.08"/>
    <circle cx="600" cy="140" r="182" fill="none" stroke="#a5b4fc" stroke-opacity="0.06"/>
    <rect x="0" y="0" width="6" height="280" fill="url(#bar)"/>

    <text x="600" y="112" text-anchor="middle" font-size="58" font-weight="800" letter-spacing="-1" fill="url(#name)">Estefano Ramirez</text>
    <text x="600" y="154" text-anchor="middle" font-size="24" font-weight="500" letter-spacing="0.3" fill="#a5b4fc">Software Developer</text>

    <line x1="548" y1="182" x2="652" y2="182" stroke="#818cf8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="600" cy="182" r="4" fill="#c4b5fd"/>

    <g font-size="12" font-weight="600" letter-spacing="0.6" text-anchor="middle" fill="#c7d2fe">
      <rect x="394" y="200" width="84" height="30" rx="15" fill="#ffffff" fill-opacity="0.05" stroke="#818cf8" stroke-opacity="0.4"/>
      <text x="436" y="219.5">PYTHON</text>
      <rect x="492" y="200" width="92" height="30" rx="15" fill="#ffffff" fill-opacity="0.05" stroke="#818cf8" stroke-opacity="0.4"/>
      <text x="538" y="219.5">FASTAPI</text>
      <rect x="598" y="200" width="78" height="30" rx="15" fill="#ffffff" fill-opacity="0.05" stroke="#818cf8" stroke-opacity="0.4"/>
      <text x="637" y="219.5">REACT</text>
      <rect x="690" y="200" width="116" height="30" rx="15" fill="#ffffff" fill-opacity="0.05" stroke="#818cf8" stroke-opacity="0.4"/>
      <text x="748" y="219.5">TYPESCRIPT</text>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="278" rx="19" fill="none" stroke="#333d63" stroke-width="2"/>
</svg>
